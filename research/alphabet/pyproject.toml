[project]
name = "lessa-alphabet-research"
version = "0.1.0"
description = "Static LESSA alphabet recognition pipeline using MediaPipe landmarks and TensorFlow."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "h5py==3.10.0",
    "keras==2.15.0",
    "matplotlib==3.8.2",
    "mediapipe==0.10.13",
    "numpy==1.24.3",
    "opencv-contrib-python==4.8.1.78",
    "pandas==2.1.4",
    "scikit-learn==1.3.2",
    "seaborn==0.13.1",
    "tensorflow==2.15.0",
]

[tool.uv]
package = false
