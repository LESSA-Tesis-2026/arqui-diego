[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for live LESSA-to-Spanish translation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "keras==3.12.1",
    "mediapipe==0.10.13",
    "numpy==1.24.3",
    "opencv-python==4.8.1.78",
    "protobuf==4.25.8",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "python-multipart>=0.0.28",
    "tensorflow==2.16.2",
    "uvicorn[standard]>=0.46.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
